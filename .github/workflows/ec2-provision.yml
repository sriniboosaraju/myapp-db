name: EC2 Provision (Test)

permissions:
  contents: read
  id-token: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  ec2-provision:
    name: EC2 Plan & Apply (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: pp

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/ec2
          exit-code: "0"
          format: json
          output: /tmp/trivy.json

      - name: Trivy results - summary table
        run: python3 $GITHUB_WORKSPACE/scripts/trivy_summary.py
        env:
          TRIVY_JSON: /tmp/trivy.json

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
          role-session-name: GitHubActions-EC2-dev-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra/ec2
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=myapp-db/dev/ec2/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Debug - state vs config
        working-directory: infra/ec2
        run: |
          echo "=== tfvars instance_type ==="
          grep ec2_instance_type "$GITHUB_WORKSPACE/infra/ec2/environments/dev.tfvars"
          echo "=== Terraform state instance_type ==="
          terraform state show aws_instance.app 2>/dev/null | grep instance_type || echo "No state found"
          echo "=== Live AWS instance_type ==="
          INSTANCE_ID=$(terraform state show aws_instance.app 2>/dev/null | grep '^\s*id\s*=' | awk '{print $3}' | tr -d '"')
          if [ -n "$INSTANCE_ID" ]; then
            aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].InstanceType' --output text
          else
            echo "No instance ID found in state"
          fi

      - name: Terraform Plan (EC2 only)
        working-directory: infra/ec2
        run: |
          terraform plan \
            -var-file="$GITHUB_WORKSPACE/infra/ec2/environments/dev.tfvars" \
            -target=aws_instance.app \
            -out=ec2.tfplan
          terraform show -json ec2.tfplan > ec2.tfplan.json

      - name: Pretty Plan
        working-directory: infra/ec2
        run: python3 $GITHUB_WORKSPACE/scripts/pretty_plan.py
        env:
          PLAN_JSON: ec2.tfplan.json

      - name: AWS Pricing cost estimate
        working-directory: infra/ec2
        run: python3 $GITHUB_WORKSPACE/scripts/aws_pricing.py
        env:
          PLAN_JSON: ec2.tfplan.json

      - name: Terraform Apply (EC2 only)
        working-directory: infra/ec2
        run: terraform apply -auto-approve ec2.tfplan

      - name: Show EC2 Outputs
        working-directory: infra/ec2
        run: |
          echo "Instance ID   : $(terraform output -raw ec2_instance_id)"
          echo "Private IP    : $(terraform output -raw ec2_private_ip)"
          echo "Security Group: $(terraform output -raw ec2_security_group_id)"
          echo "AMI ID        : $(terraform output -raw ec2_ami_id)"

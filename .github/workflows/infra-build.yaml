name: Infrastructure - Terraform

on:
  push:
    branches:
      - main
      - develop
      - dev
    paths:
      - 'infra/**'
      - '.github/workflows/infra-build.yaml'
  pull_request:
    branches:
      - main
      - develop
      - dev
    paths:
      - 'infra/**'
      - '.github/workflows/infra-build.yaml'
  workflow_dispatch:

# Required for OIDC
permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: '1.7.0'
  AWS_REGION: 'us-east-1'
  ENVIRONMENT: 'dev'

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: terraform-validate
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Plan-${{ github.run_id }}

      - name: Verify AWS Identity
        run: |
          echo "✅ Authenticated as:"
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=myapp-db/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        env:
          TF_VAR_environment: dev
        run: |
          terraform plan \
            -var-file="environments/dev.tfvars" \
            -out=tfplan-dev

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infra/tfplan-dev
          retention-days: 5

  terraform-apply-dev:
    name: Apply to Dev
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    defaults:
      run:
        working-directory: ./infra
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Apply-${{ github.run_id }}

      - name: Verify AWS Identity
        run: |
          echo "✅ Authenticated as:"
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=myapp-db/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        env:
          TF_VAR_environment: dev
        run: terraform apply -auto-approve -var-file="environments/dev.tfvars"

      - name: Output Database Info
        id: db-output
        run: |
          echo "db_endpoint=$(terraform output -raw db_instance_address 2>/dev/null)" >> $GITHUB_OUTPUT
          echo "db_port=$(terraform output -raw db_instance_port 2>/dev/null)" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Infrastructure Deployed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Endpoint**: ${{ steps.db-output.outputs.db_endpoint }}:${{ steps.db-output.outputs.db_port }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Ready for app deployment" >> $GITHUB_STEP_SUMMARY

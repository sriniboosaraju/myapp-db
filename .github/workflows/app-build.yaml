name: Build and Deploy App

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'charts/**'
      - '.github/workflows/app-build.yaml'
  pull_request:
    branches:
      - main
      - develop
  workflow_run:
    workflows: ["Infrastructure - Terraform"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - qa
          - staging
          - prod

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TF_VERSION: '1.7.0'
  AWS_REGION: 'us-east-1'

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      short-sha: ${{ steps.vars.outputs.short-sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set variables
        id: vars
        run: |
          echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=${{ steps.vars.outputs.short-sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  provision-db:
    name: Provision Database
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment: 
          - ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
    environment:
      name: ${{ matrix.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Check if database exists
        id: check-db
        working-directory: ./infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=myapp/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          
          if terraform state list 2>/dev/null | grep -q "aws_db_instance.postgres"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Database already exists, skipping creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Database does not exist, will create"
          fi

      - name: Create database if not exists
        if: steps.check-db.outputs.exists == 'false'
        working-directory: ./infra
        env:
          TF_VAR_environment: ${{ matrix.environment }}
        run: |
          echo "Creating database for ${{ matrix.environment }} environment..."
          terraform apply -var-file="environments/${{ matrix.environment }}.tfvars" -auto-approve

      - name: Get database outputs
        id: db-outputs
        working-directory: ./infra
        run: |
          DB_HOST=$(terraform output -raw db_instance_address)
          DB_PORT=$(terraform output -raw db_instance_port)
          DB_NAME=$(terraform output -raw db_instance_name)
          DB_USER=$(terraform output -raw db_instance_username)
          DB_SECRET_ARN=$(terraform output -raw db_credentials_secret_arn)
          
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT
          echo "db_secret_arn=$DB_SECRET_ARN" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets[format('EKS_CLUSTER_NAME_{0}', matrix.environment)] }}

      - name: Attach database to app
        env:
          NAMESPACE: myapp-${{ matrix.environment }}
          DB_HOST: ${{ steps.db-outputs.outputs.db_host }}
          DB_PORT: ${{ steps.db-outputs.outputs.db_port }}
          DB_NAME: ${{ steps.db-outputs.outputs.db_name }}
          DB_USER: ${{ steps.db-outputs.outputs.db_user }}
          DB_SECRET_ARN: ${{ steps.db-outputs.outputs.db_secret_arn }}
        run: |
          # Create namespace if it doesn't exist
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          
          # Get password from Secrets Manager
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "${DB_SECRET_ARN}" \
            --query 'SecretString' \
            --output text | jq -r '.password')
          
          # Create Kubernetes secret with database credentials
          kubectl create secret generic myapp-db-credentials \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_PORT="${DB_PORT}" \
            --from-literal=DB_NAME="${DB_NAME}" \
            --from-literal=DB_USER="${DB_USER}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --namespace=${NAMESPACE} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Label the secret
          kubectl label secret myapp-db-credentials \
            app=myapp \
            environment=${{ matrix.environment }} \
            addon=postgres \
            --namespace=${NAMESPACE} \
            --overwrite
          
          echo "✅ Database attached to app in namespace: ${NAMESPACE}"

      - name: Display database info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Database provisioned and attached!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Environment: ${{ matrix.environment }}"
          echo "Database Host: ${{ steps.db-outputs.outputs.db_host }}"
          echo "Database Port: ${{ steps.db-outputs.outputs.db_port }}"
          echo "Database Name: ${{ steps.db-outputs.outputs.db_name }}"
          echo "Secret: myapp-db-credentials"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build, provision-db]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        environment:
          - ${{ github.ref == 'refs/heads/main' && 'staging' || 'dev' }}
    environment:
      name: ${{ matrix.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update ArgoCD Application
        run: |
          echo "Updating image tag to: ${{ needs.build.outputs.short-sha }}"
          
          # Update the image tag in values file
          sed -i "s/tag: .*/tag: \"${{ needs.build.outputs.short-sha }}\"/" \
            charts/myapp/values-${{ matrix.environment }}.yaml
          
          # Commit and push changes (optional, if using GitOps)
          # git config --global user.name "github-actions[bot]"
          # git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # git add charts/myapp/values-${{ matrix.environment }}.yaml
          # git commit -m "Update ${{ matrix.environment }} image to ${{ needs.build.outputs.short-sha }}"
          # git push

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets[format('EKS_CLUSTER_NAME_{0}', matrix.environment)] }}

      - name: Deploy with Helm
        run: |
          helm upgrade --install myapp charts/myapp \
            --namespace myapp-${{ matrix.environment }} \
            --values charts/myapp/values-${{ matrix.environment }}.yaml \
            --set image.tag=${{ needs.build.outputs.short-sha }} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/myapp \
            --namespace myapp-${{ matrix.environment }} \
            --timeout=5m
          
          echo "✅ Application deployed successfully!"

      - name: Get application URL
        id: get-url
        run: |
          SERVICE_URL=$(kubectl get service myapp \
            --namespace myapp-${{ matrix.environment }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          if [ -n "$SERVICE_URL" ]; then
            echo "url=http://${SERVICE_URL}" >> $GITHUB_OUTPUT
            echo "Application URL: http://${SERVICE_URL}"
          else
            echo "Service URL not yet available"
          fi

      - name: Summary
        run: |
          echo "## Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ needs.build.outputs.short-sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: ✅ Provisioned and attached" >> $GITHUB_STEP_SUMMARY
          echo "- **Application**: ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.get-url.outputs.url }}" ]; then
            echo "- **URL**: ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Provision Production Database
        working-directory: ./infra
        env:
          TF_VAR_environment: prod
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=myapp/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
          
          terraform apply -var-file="environments/prod.tfvars" -auto-approve

      - name: Get database outputs
        id: db-outputs
        working-directory: ./infra
        run: |
          echo "db_host=$(terraform output -raw db_instance_address)" >> $GITHUB_OUTPUT
          echo "db_port=$(terraform output -raw db_instance_port)" >> $GITHUB_OUTPUT
          echo "db_name=$(terraform output -raw db_instance_name)" >> $GITHUB_OUTPUT
          echo "db_secret_arn=$(terraform output -raw db_credentials_secret_arn)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME_PROD }}

      - name: Attach database to production app
        env:
          NAMESPACE: myapp-prod
          DB_HOST: ${{ steps.db-outputs.outputs.db_host }}
          DB_PORT: ${{ steps.db-outputs.outputs.db_port }}
          DB_NAME: ${{ steps.db-outputs.outputs.db_name }}
          DB_SECRET_ARN: ${{ steps.db-outputs.outputs.db_secret_arn }}
        run: |
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
          
          DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id "${DB_SECRET_ARN}" \
            --query 'SecretString' \
            --output text | jq -r '.password')
          
          kubectl create secret generic myapp-db-credentials \
            --from-literal=DB_HOST="${DB_HOST}" \
            --from-literal=DB_PORT="${DB_PORT}" \
            --from-literal=DB_NAME="${DB_NAME}" \
            --from-literal=DB_USER="postgres" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --namespace=${NAMESPACE} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Production
        run: |
          helm upgrade --install myapp charts/myapp \
            --namespace myapp-prod \
            --values charts/myapp/values-prod.yaml \
            --set image.tag=${{ needs.build.outputs.short-sha }} \
            --wait \
            --timeout 10m

      - name: Verify production deployment
        run: |
          kubectl rollout status deployment/myapp \
            --namespace myapp-prod \
            --timeout=10m
          
          echo "✅ Production deployment successful!"

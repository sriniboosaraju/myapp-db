name: Build & Deploy to Dev

permissions:
  contents: write
  packages: write
  id-token: write

on:
  # Run on app or chart changes
  push:
    branches:
      - dev-infra
    paths:
      - 'app/**'
      - 'charts/**'
      - 'deploy/**'
  workflow_dispatch:  # Manual trigger
    inputs:
      enable_rds:
        description: 'Enable RDS Database Addon'
        required: false
        type: boolean
        default: true
      enable_redis:
        description: 'Enable Redis Addon'
        required: false
        type: boolean
        default: false

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
    - name: Display Addon Configuration
      run: |
        echo "## Addon Configuration 🔧" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ github.event_name }}" == "push" ]; then
          echo "- **Trigger**: Automatic (push)" >> $GITHUB_STEP_SUMMARY
          echo "- **RDS Database**: ✅ Enabled (default for push)" >> $GITHUB_STEP_SUMMARY
          echo "- **Redis**: ❌ Not configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Trigger**: Manual (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.enable_rds }}" == "true" ]; then
            echo "- **RDS Database**: ✅ Enabled" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **RDS Database**: ❌ Disabled" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ inputs.enable_redis }}" == "true" ]; then
            echo "- **Redis**: ✅ Enabled (future)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Redis**: ❌ Disabled" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
    
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Get short SHA tag
      id: vars
      run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image to GHCR
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/myapp-db:${{ steps.vars.outputs.TAG }}
          ghcr.io/${{ github.repository_owner }}/myapp-db:latest

        # Context is the app folder
        file: ./app/Dockerfile
        context: ./app

    - name: Update charts/myapp-db/values-dev-infra.yaml with new tag
      run: |
        TAG=${{ steps.vars.outputs.TAG }}
        echo "Updating image tag to $TAG in charts/myapp-db/values-dev-infra.yaml"
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        # Update tag inside values-dev-infra.yaml
        yq -i ".image.tag = \"${TAG}\"" charts/myapp-db/values-dev-infra.yaml

    - name: Commit and push values-dev-infra change
      env:
        GIT_COMMITTER_NAME: "github-actions[bot]"
        GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
      run: |
        TAG=${{ steps.vars.outputs.TAG }}
        git config user.name "$GIT_COMMITTER_NAME"
        git config user.email "$GIT_COMMITTER_EMAIL"
        git add charts/myapp-db/values-dev-infra.yaml
        git commit -m "ci: bump dev-infra image tag to ${TAG} [ci skip]" || echo "No changes to commit"
        # Pull latest changes first to avoid conflicts
        git pull --rebase origin dev-infra
        git push origin HEAD:dev-infra
      # The above uses the default GITHUB_TOKEN that Actions provides for pushing back to the same repo

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: us-east-1
        role-session-name: GitHubActions-Deploy-${{ github.run_id }}

    - name: Setup Terraform
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_rds == true)
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.7.0'
        terraform_wrapper: false

    - name: Provision Database (if enabled)
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_rds == true)
      id: provision-db
      run: |
        cd infra
        
        echo "🔧 Initializing Terraform..."
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=myapp/dev/terraform.tfstate" \
          -backend-config="region=us-east-1"
        
        echo "🔍 Checking if database exists..."
        if terraform state list 2>/dev/null | grep -q "aws_db_instance.postgres"; then
          echo "✅ Database already exists, skipping creation"
          echo "db_created=false" >> $GITHUB_OUTPUT
        else
          echo "📦 Database does not exist, provisioning now..."
          terraform apply -var-file="environments/dev.tfvars" -auto-approve
          echo "✅ Database created successfully!"
          echo "db_created=true" >> $GITHUB_OUTPUT
        fi

    - name: Get Database Credentials
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_rds == true)
      id: db-creds
      run: |
        cd infra
        
        echo "📖 Reading database credentials from Terraform state..."
        
        # Get database credentials from Terraform state
        DB_HOST=$(terraform output -raw db_instance_address)
        DB_PORT=$(terraform output -raw db_instance_port)
        DB_NAME=$(terraform output -raw db_instance_name)
        DB_USER=$(terraform output -raw db_instance_username)
        DB_SECRET_ARN=$(terraform output -raw db_credentials_secret_arn)
        
        # Get password from Secrets Manager
        DB_PASSWORD=$(aws secretsmanager get-secret-value \
          --secret-id "${DB_SECRET_ARN}" \
          --query 'SecretString' \
          --output text | jq -r '.password')
        
        echo "DB_HOST=${DB_HOST}" >> $GITHUB_OUTPUT
        echo "DB_PORT=${DB_PORT}" >> $GITHUB_OUTPUT
        echo "DB_NAME=${DB_NAME}" >> $GITHUB_OUTPUT
        echo "DB_USER=${DB_USER}" >> $GITHUB_OUTPUT
        echo "::add-mask::${DB_PASSWORD}"
        echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_OUTPUT
        
        echo "✅ Database credentials retrieved successfully"
    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --name eks-srini --region us-east-1

    - name: Create namespace if not exists
      run: |
        kubectl create namespace myapp-dev --dry-run=client -o yaml | kubectl apply -f -

    - name: Create database credentials secret
      if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_rds == true)
      run: |
        kubectl create secret generic myapp-db-credentials \
          --from-literal=DB_HOST="${{ steps.db-creds.outputs.DB_HOST }}" \
          --from-literal=DB_PORT="${{ steps.db-creds.outputs.DB_PORT }}" \
          --from-literal=DB_NAME="${{ steps.db-creds.outputs.DB_NAME }}" \
          --from-literal=DB_USER="${{ steps.db-creds.outputs.DB_USER }}" \
          --from-literal=DB_PASSWORD="${{ steps.db-creds.outputs.DB_PASSWORD }}" \
          --namespace=myapp-dev \
          --dry-run=client -o yaml | kubectl apply -f -
        
        kubectl label secret myapp-db-credentials \
          app=myapp \
          environment=dev \
          addon=postgres \
          --namespace=myapp-dev \
          --overwrite

    - name: Deploy ArgoCD Application
      run: |
        COMMIT_SHA=$(git rev-parse HEAD)
        echo "Deploying commit: ${COMMIT_SHA}"
        
        # Apply ArgoCD Application definition
        kubectl apply -f deploy/apps/myapp-dev-app.yaml -n argocd
        
        # Update targetRevision to the specific commit
        kubectl patch application myapp-dev -n argocd \
          --type merge \
          -p "{\"spec\": {\"source\": {\"targetRevision\": \"${COMMIT_SHA}\"}}}"
        
        # Trigger sync with the specific commit
        kubectl patch application myapp-dev -n argocd \
          --type merge \
          -p "{\"operation\": {\"initiatedBy\": {\"username\": \"github-actions\"}, \"sync\": {\"revision\": \"${COMMIT_SHA}\"}}}"
        
        echo "✅ ArgoCD Application deployed. Syncing to commit ${COMMIT_SHA}..."
        echo "🔄 ArgoCD will continue syncing in the background. Check ArgoCD UI for status."

    - name: Deployment Summary
      run: |
        echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: dev-infra" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ghcr.io/${{ github.repository_owner }}/myapp-db:${{ steps.vars.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
        
        # Show database info if RDS is enabled
        if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.enable_rds }}" == "true" ]; then
          if [ "${{ steps.provision-db.outputs.db_created }}" == "true" ]; then
            echo "- **Database**: 🆕 New database created and connected to ${{ steps.db-creds.outputs.DB_HOST }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Database**: ✅ Connected to existing database ${{ steps.db-creds.outputs.DB_HOST }}" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "- **Database**: ❌ Not attached (standalone mode)" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "- **Namespace**: myapp-dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment**: Via ArgoCD" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Addons Status:" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ github.event_name }}" == "push" ] || [ "${{ inputs.enable_rds }}" == "true" ]; then
          echo "- 🗄️ **RDS PostgreSQL**: Attached" >> $GITHUB_STEP_SUMMARY
        else
          echo "- 🗄️ **RDS PostgreSQL**: Not attached" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ inputs.enable_redis }}" == "true" ]; then
          echo "- 🔴 **Redis**: Enabled (future implementation)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- 🔴 **Redis**: Not configured" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View in ArgoCD: Check ArgoCD UI for myapp-dev application" >> $GITHUB_STEP_SUMMARY

name: Build & Deploy to Dev

permissions:
  contents: write
  packages: write
  id-token: write

on:
  # Run after infrastructure workflow completes (DB created/updated)
  workflow_run:
    workflows: ["Infrastructure - Terraform"]
    types:
      - completed
    branches:
      - dev
  # Run on app changes (DB already exists)
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'charts/**'
      - 'deploy/**'
  workflow_dispatch:  # Manual trigger

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    # Run if: infrastructure succeeded, app changes pushed, or manual trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Get short SHA tag
      id: vars
      run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image to GHCR
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/myapp:${{ steps.vars.outputs.TAG }}
          ghcr.io/${{ github.repository_owner }}/myapp:latest

        # Context is the app folder
        file: ./app/Dockerfile
        context: ./app

    - name: Update charts/myapp/values-dev.yaml with new tag
      run: |
        TAG=${{ steps.vars.outputs.TAG }}
        echo "Updating image tag to $TAG in charts/myapp/values-dev.yaml"
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        # Update tag inside values-dev.yaml
        yq -i ".image.tag = \"${TAG}\"" charts/myapp/values-dev.yaml

    - name: Commit and push values-dev change
      env:
        GIT_COMMITTER_NAME: "github-actions[bot]"
        GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
      run: |
        TAG=${{ steps.vars.outputs.TAG }}
        git config user.name "$GIT_COMMITTER_NAME"
        git config user.email "$GIT_COMMITTER_EMAIL"
        git add charts/myapp/values-dev.yaml
        git commit -m "ci: bump dev image tag to ${TAG} [ci skip]" || echo "No changes to commit"
        # Pull latest changes first to avoid conflicts
        git pull --rebase origin dev
        git push origin HEAD:dev
      # The above uses the default GITHUB_TOKEN that Actions provides for pushing back to the same repo

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: us-east-1
        role-session-name: GitHubActions-Deploy-${{ github.run_id }}

    - name: Setup Terraform to get DB outputs
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.7.0'
        terraform_wrapper: false

    - name: Get Database Credentials
      id: db-creds
      run: |
        cd infra
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=myapp/dev/terraform.tfstate" \
          -backend-config="region=us-east-1"
        
        DB_HOST=$(terraform output -raw db_instance_address)
        DB_PORT=$(terraform output -raw db_instance_port)
        DB_NAME=$(terraform output -raw db_instance_name)
        DB_USER=$(terraform output -raw db_instance_username)
        DB_SECRET_ARN=$(terraform output -raw db_credentials_secret_arn)
        
        # Get password from Secrets Manager
        DB_PASSWORD=$(aws secretsmanager get-secret-value \
          --secret-id "${DB_SECRET_ARN}" \
          --query 'SecretString' \
          --output text | jq -r '.password')
        
        echo "DB_HOST=${DB_HOST}" >> $GITHUB_OUTPUT
        echo "DB_PORT=${DB_PORT}" >> $GITHUB_OUTPUT
        echo "DB_NAME=${DB_NAME}" >> $GITHUB_OUTPUT
        echo "DB_USER=${DB_USER}" >> $GITHUB_OUTPUT
        echo "::add-mask::${DB_PASSWORD}"
        echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_OUTPUT

    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --name srini-cluster --region us-east-1

    - name: Create namespace if not exists
      run: |
        kubectl create namespace myapp-dev --dry-run=client -o yaml | kubectl apply -f -

    - name: Create database credentials secret
      run: |
        kubectl create secret generic myapp-db-credentials \
          --from-literal=DB_HOST="${{ steps.db-creds.outputs.DB_HOST }}" \
          --from-literal=DB_PORT="${{ steps.db-creds.outputs.DB_PORT }}" \
          --from-literal=DB_NAME="${{ steps.db-creds.outputs.DB_NAME }}" \
          --from-literal=DB_USER="${{ steps.db-creds.outputs.DB_USER }}" \
          --from-literal=DB_PASSWORD="${{ steps.db-creds.outputs.DB_PASSWORD }}" \
          --namespace=myapp-dev \
          --dry-run=client -o yaml | kubectl apply -f -
        
        kubectl label secret myapp-db-credentials \
          app=myapp \
          environment=dev \
          addon=postgres \
          --namespace=myapp-dev \
          --overwrite

    - name: Deploy to Kubernetes using Helm
      run: |
        helm upgrade --install myapp ./charts/myapp \
          --namespace myapp-dev \
          --values ./charts/myapp/values-dev.yaml \
          --wait \
          --timeout 5m

    - name: Deployment Summary
      run: |
        echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ghcr.io/${{ github.repository_owner }}/myapp:${{ steps.vars.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Database**: Connected to ${{ steps.db-creds.outputs.DB_HOST }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace**: myapp-dev" >> $GITHUB_STEP_SUMMARY

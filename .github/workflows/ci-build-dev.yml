name: Build & Deploy to Dev

permissions:
  contents: write
  packages: write
  id-token: write

on:
  # Run on app, chart, deploy, infra or this workflow's own changes
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'charts/**'
      - 'deploy/**'
      - 'infra/**'
      - '.github/workflows/ci-build-dev.yml'
  workflow_dispatch:  # Manual trigger

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Get short SHA tag
      id: vars
      run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image to GHCR
      uses: docker/build-push-action@v4
      with:
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/myapp-db:${{ steps.vars.outputs.TAG }}
          ghcr.io/${{ github.repository_owner }}/myapp-db:latest

        # Context is the app folder
        file: ./app/Dockerfile
        context: ./app

    - name: Update charts/myapp-db/values-dev.yaml with new tag
      run: |
        TAG=${{ steps.vars.outputs.TAG }}
        echo "Updating image tag to $TAG in charts/myapp-db/values-dev.yaml"
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq
        # Update tag inside values-dev.yaml
        yq -i ".image.tag = \"${TAG}\"" charts/myapp-db/values-dev.yaml

    - name: Commit and push values-dev change
      env:
        GIT_COMMITTER_NAME: "github-actions[bot]"
        GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
      run: |
        TAG=${{ steps.vars.outputs.TAG }}
        git config user.name "$GIT_COMMITTER_NAME"
        git config user.email "$GIT_COMMITTER_EMAIL"
        git add charts/myapp-db/values-dev.yaml
        git commit -m "ci: bump dev image tag to ${TAG} [ci skip]" || echo "No changes to commit"
        # Pull latest changes first to avoid conflicts
        git pull --rebase origin dev
        git push origin HEAD:dev
      # The above uses the default GITHUB_TOKEN that Actions provides for pushing back to the same repo

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: us-east-1
        role-session-name: GitHubActions-Deploy-${{ github.run_id }}

    - name: Fetch DB credentials from Secrets Manager
      id: db-creds
      run: |
        SECRET_NAME="myapp-db-db-dev-db-credentials"
        echo "🔍 Fetching DB credentials from Secrets Manager: ${SECRET_NAME}"

        SECRET=$(aws secretsmanager get-secret-value \
          --secret-id "${SECRET_NAME}" \
          --query 'SecretString' \
          --output text)

        DB_HOST=$(echo "$SECRET" | jq -r '.host')
        DB_PORT=$(echo "$SECRET" | jq -r '.port')
        DB_NAME=$(echo "$SECRET" | jq -r '.dbname')
        DB_USER=$(echo "$SECRET" | jq -r '.username')
        DB_PASSWORD=$(echo "$SECRET" | jq -r '.password')

        echo "DB_HOST=${DB_HOST}" >> $GITHUB_OUTPUT
        echo "DB_PORT=${DB_PORT}" >> $GITHUB_OUTPUT
        echo "DB_NAME=${DB_NAME}" >> $GITHUB_OUTPUT
        echo "DB_USER=${DB_USER}" >> $GITHUB_OUTPUT
        echo "::add-mask::${DB_PASSWORD}"
        echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_OUTPUT
        echo "✅ DB credentials fetched successfully"

    - name: Update Karpenter values with real endpoint and role ARN
      run: |
        # Get EKS cluster endpoint
        EKS_ENDPOINT=$(aws eks describe-cluster \
          --name eks-srini \
          --query 'cluster.endpoint' \
          --output text)

        # Get Karpenter controller role ARN directly from AWS IAM
        KARPENTER_ROLE_ARN=$(aws iam get-role \
          --role-name KarpenterControllerRole-eks-srini \
          --query 'Role.Arn' \
          --output text 2>/dev/null || echo "")

        if [ -z "$KARPENTER_ROLE_ARN" ] || [ -z "$EKS_ENDPOINT" ]; then
          echo "⚠️ Skipping Karpenter values update — role or endpoint not available yet"
          exit 0
        fi

        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        echo "Updating clusterEndpoint and role ARN in charts/karpenter/values.yaml"
        yq -i ".settings.clusterEndpoint = \"${EKS_ENDPOINT}\"" charts/karpenter/values.yaml
        yq -i ".serviceAccount.annotations[\"eks.amazonaws.com/role-arn\"] = \"${KARPENTER_ROLE_ARN}\"" charts/karpenter/values.yaml

        # Commit if changed
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add charts/karpenter/values.yaml
        git commit -m "ci: update karpenter clusterEndpoint and role ARN [ci skip]" || echo "No changes to commit"
        git pull --rebase origin dev
        git push origin HEAD:dev

    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --name eks-srini --region us-east-1

    - name: Create namespace if not exists
      run: |
        kubectl create namespace myapp-db-dev --dry-run=client -o yaml | kubectl apply -f -

    - name: Create database credentials secret
      run: |
        kubectl create secret generic myapp-db-credentials \
          --from-literal=DB_HOST="${{ steps.db-creds.outputs.DB_HOST }}" \
          --from-literal=DB_PORT="${{ steps.db-creds.outputs.DB_PORT }}" \
          --from-literal=DB_NAME="${{ steps.db-creds.outputs.DB_NAME }}" \
          --from-literal=DB_USER="${{ steps.db-creds.outputs.DB_USER }}" \
          --from-literal=DB_PASSWORD="${{ steps.db-creds.outputs.DB_PASSWORD }}" \
          --namespace=myapp-db-dev \
          --dry-run=client -o yaml | kubectl apply -f -
        
        kubectl label secret myapp-db-credentials \
          app=myapp-db \
          environment=dev \
          addon=postgres \
          --namespace=myapp-db-dev \
          --overwrite

    - name: Apply platform ArgoCD Applications (Karpenter)
      run: |
        kubectl apply -f deploy/platform/karpenter-app.yaml -n argocd
        kubectl apply -f deploy/platform/karpenter-resources.yaml -n argocd
        echo "✅ Karpenter ArgoCD apps applied"

    - name: Deploy ArgoCD Application
      run: |
        COMMIT_SHA=$(git rev-parse HEAD)
        echo "Deploying commit: ${COMMIT_SHA}"
        
        # Apply ArgoCD Application definition
        kubectl apply -f deploy/apps/myapp-dev-app.yaml -n argocd
        
        # Update targetRevision to the specific commit
        kubectl patch application myapp-db-dev -n argocd \
          --type merge \
          -p "{\"spec\": {\"source\": {\"targetRevision\": \"${COMMIT_SHA}\"}}}"
        
        # Trigger sync with the specific commit
        kubectl patch application myapp-db-dev -n argocd \
          --type merge \
          -p "{\"operation\": {\"initiatedBy\": {\"username\": \"github-actions\"}, \"sync\": {\"revision\": \"${COMMIT_SHA}\"}}}"
        
        echo "✅ ArgoCD Application deployed. Syncing to commit ${COMMIT_SHA}..."
        echo "🔄 ArgoCD will continue syncing in the background. Check ArgoCD UI for status."

    - name: Deployment Summary
      run: |
        echo "## Deployment Complete 🚀" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ghcr.io/${{ github.repository_owner }}/myapp-db:${{ steps.vars.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Database**: Connected to ${{ steps.db-creds.outputs.DB_HOST }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace**: myapp-db-dev" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment**: Via ArgoCD" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View in ArgoCD: Check ArgoCD UI for myapp-db-dev application" >> $GITHUB_STEP_SUMMARY

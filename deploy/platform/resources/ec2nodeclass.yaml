apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: KarpenterNodeRole

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-srini

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-srini

  amiSelectorTerms:
    - alias: al2@latest

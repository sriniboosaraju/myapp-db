apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.karpenter.sh
    chart: karpenter
    targetRevision: v0.37.0
    helm:
      values: |
        settings:
          clusterName: eks-srini
          clusterEndpoint: https://943D669DBB44E4CFBF30A466AD36BC2D.gr7.us-east-1.eks.amazonaws.com
        serviceAccount:
          create: true
          name: karpenter
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::479604670156:role/KarpenterControllerRole-eks-srini
        controller:
          resources:
            requests:
              cpu: 500m
              memory: 512Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-resources
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/sriniboosaraju/myapp-db
    targetRevision: HEAD
    path: deploy/platform/resources

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
